<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microwave 2D · 한 화면</title>
<style>
  :root {
    --ink: #1c1c1a; --muted: #6b6a66; --faint: #a7a5a0; --line: #e4e2dd; --paper: #fbfaf7; --card: #ffffff;
    --center: #c44f2a; --wall: #2f6fa8; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; overflow: hidden; }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 16px 20px; max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-weight: 600; letter-spacing: .01em; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .material { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
  .material label { padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); user-select: none; }
  .material input { display: none; }
  .material input:checked + span { display: block; }
  .material label:has(input:checked) { background: var(--ink); color: #fff; }
  main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; min-height: 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .panel h2 span { font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .canvas-box { flex: 1; min-height: 0; position: relative; }
  #chart { cursor: ew-resize; }
  .readout { display: grid; grid-template-columns: auto 1fr auto; column-gap: 14px; row-gap: 6px; align-items: baseline; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .readout .name { color: var(--muted); }
  .readout .name i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  .readout .value { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .readout .ref { color: var(--muted); font-family: var(--mono); font-size: 13px; text-align: right; white-space: nowrap; }
  .readout.extrap .value { color: var(--faint); }
  .power { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 4px; }
  .power b { font-family: var(--mono); font-size: 30px; font-weight: 500; }
  .power span { color: var(--muted); }
  .status { min-height: 20px; color: var(--muted); font-size: 13px; }
  .status.warn { color: #9a4a12; }
  footer { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  footer a.how { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { height: auto; }
    main { grid-template-columns: 1fr; }
    .canvas-box { height: 300px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Microwave 2D <small>정상상태 온도 · 축대칭 FVM</small></div>
    <div class="material" id="material">
      <label><input type="radio" name="material" value="rutile-reduced-600c-30m" checked><span>TiO₂</span></label>
      <label><input type="radio" name="material" value="sic-60-100-mesh"><span>SiC</span></label>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>온도 맵 <span id="map-note">r–z 단면, °C</span></h2>
      <div class="canvas-box"><canvas id="map"></canvas></div>
    </section>

    <section class="panel">
      <h2>흡수 전력 → 온도 (°C) <span>곡선 위를 끌어서 전력 선택 · ● 측정점</span></h2>
      <div class="power"><b id="p-value">26.0</b><span>W 흡수</span><span id="status" class="status"></span></div>
      <div class="canvas-box"><canvas id="chart"></canvas></div>
      <div class="readout" id="readout">
        <div class="name"><i style="background:var(--center)"></i>중심 (FBG)</div><div class="value" id="v-center">—</div><div class="ref" id="r-center"></div>
        <div class="name"><i style="background:var(--wall)"></i>석영 벽</div><div class="value" id="v-wall">—</div><div class="ref" id="r-wall"></div>
        <div class="name"><i style="background:var(--faint)"></i>베드 평균</div><div class="value" id="v-avg">—</div><div class="ref" id="r-avg">측정 없음</div>
      </div>
    </section>
  </main>

  <footer>
    <div id="fixed-line"></div>
    <a class="how" id="how" href="../index.html">이 온도가 어떻게 나왔는지 →</a>
  </footer>
</div>

<script type="module">
import { materialProfiles, parseRows } from "../solver.js";

const $ = id => document.getElementById(id);
const CENTER = "#c44f2a", WALL = "#2f6fa8";
const worker = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });
const curveWorker = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });

const state = { material: "rutile-reduced-600c-30m", P: 26, measured: [], Pmax: 26, Pspan: 34, sol: null, curve: null, curveCoarse: null, jobId: 0, curveId: 0, busy: false, pending: null, fullTimer: null };

function loadMaterial(id) {
  const profile = materialProfiles[id], d = profile.defaults;
  state.material = id;
  state.measured = parseRows(profile.experiments, 3).map(r => ({ P: r[0], wall: r[1], center: r[2] }));
  state.Pmax = Math.max(...state.measured.map(m => m.P));
  state.Pspan = Math.ceil(state.Pmax * 1.3);
  state.P = d.pabs; state.sol = null; state.curve = null; state.curveCoarse = null;
  $("fixed-line").innerHTML = `${d.diameter} mm × ${d.length} mm 베드, ${d.mass.toFixed(3)} g, ${d.gas} ${d.flow} sccm, ${d.ambient} °C, ${d.frequency} GHz. <a href="../index.html">바꾸기</a>`;
  const n = 14, powers = Array.from({ length: n }, (_, i) => state.Pspan * i / (n - 1));
  state.curveId++;
  curveWorker.postMessage({ type: "curve", id: state.curveId, material: id, coarse: true, powers });
  curveWorker.postMessage({ type: "curve", id: state.curveId, material: id, coarse: false, powers });
  requestSolve(true); scheduleFull(); drawChart(); renderNumbers();
}

function requestSolve(coarse) {
  const job = { type: "solve", id: ++state.jobId, material: state.material, P: state.P, coarse };
  if (state.busy) { state.pending = job; return; }
  state.busy = true; worker.postMessage(job);
}
function scheduleFull() { clearTimeout(state.fullTimer); state.fullTimer = setTimeout(() => requestSolve(false), 220); }

curveWorker.onmessage = event => {
  const m = event.data;
  if (m.id !== state.curveId) return;
  if (m.coarse) state.curveCoarse = m.points; else state.curve = m.points;
  drawChart();
};
worker.onmessage = event => {
  const m = event.data;
  state.busy = false;
  if (state.pending) { const job = state.pending; state.pending = null; state.busy = true; worker.postMessage(job); }
  if (m.material !== state.material || (m.P !== state.P && state.sol)) return;
  if (m.coarse && state.sol && !state.sol.coarse && state.sol.P === state.P) return;
  state.sol = m; drawMap(); drawChart(); renderNumbers();
};

function setPower(P) {
  P = Math.max(0, Math.min(state.Pspan, P));
  const snap = state.measured.find(m => Math.abs(m.P - P) < .35);
  P = snap ? snap.P : Math.round(P * 2) / 2;
  if (P === state.P) return;
  state.P = P; requestSolve(true); scheduleFull(); drawChart(); renderNumbers();
}

/* ---------- numbers ---------- */
const fmt = (x, d = 0) => Number.isFinite(x) ? x.toFixed(d) : "—";
function measuredAt(P) {
  const exact = state.measured.find(m => Math.abs(m.P - P) < 1e-9);
  if (exact) return { kind: "exact", ...exact };
  if (P > state.Pmax || P < 0) return { kind: "outside" };
  const m = state.measured;
  for (let i = 0; i + 1 < m.length; i++) if (P >= m[i].P && P <= m[i + 1].P) {
    const t = (P - m[i].P) / (m[i + 1].P - m[i].P);
    return { kind: "interp", wall: m[i].wall + t * (m[i + 1].wall - m[i].wall), center: m[i].center + t * (m[i + 1].center - m[i].center) };
  }
  return { kind: "outside" };
}
function renderNumbers() {
  $("p-value").textContent = state.P.toFixed(1);
  const s = state.sol, ref = measuredAt(state.P), out = ref.kind === "outside";
  $("readout").classList.toggle("extrap", out);
  const st = $("status");
  if (out) { st.textContent = `측정 범위 밖 (최대 ${state.Pmax} W), 외삽`; st.className = "status warn"; }
  else if (!s) { st.textContent = "계산 중…"; st.className = "status"; }
  else { st.textContent = (s.coarse ? "빠른 격자" : "전체 격자") + (s.converged ? "" : " · 미수렴"); st.className = "status"; }
  const put = (key, model, meas) => {
    $("v-" + key).textContent = s ? fmt(model) + " °C" : "—";
    const r = $("r-" + key);
    if (!s || out) { r.textContent = out ? "측정 없음" : ""; return; }
    const diff = model - meas, sign = diff >= 0 ? "+" : "−";
    r.textContent = `${ref.kind === "exact" ? "측정" : "측정 보간"} ${meas.toFixed(1)} · ${sign}${Math.abs(diff).toFixed(1)}`;
  };
  if (s) { put("center", s.fbg, ref.center); put("wall", s.wall, ref.wall); } else { put("center"); put("wall"); }
  $("v-avg").textContent = s ? fmt(s.avg) + " °C" : "—";
}

/* ---------- canvas helpers ---------- */
function fit(canvas) {
  const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W: r.width, H: r.height };
}

/* ---------- temperature map ---------- */
const RAMP = [[255, 247, 236], [253, 208, 162], [253, 141, 60], [217, 72, 1], [127, 39, 4]];
function ramp(t) {
  t = Math.max(0, Math.min(1, t)); const x = t * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(x)), f = x - i;
  const a = RAMP[i], b = RAMP[i + 1]; return [0, 1, 2].map(k => Math.round(a[k] + f * (b[k] - a[k])));
}
function drawMap() {
  const s = state.sol, { ctx, W, H } = fit($("map"));
  ctx.clearRect(0, 0, W, H);
  if (!s) return;
  const ml = 34, mr = 62, mt = 10, mb = 30, pw = W - ml - mr, ph = H - mt - mb;
  const scale = Math.min(pw / (2 * s.Rd), ph / s.Hd), ox = ml + (pw - 2 * s.Rd * scale) / 2, oy = mt + (ph - s.Hd * scale) / 2;
  const px = r => ox + (r + s.Rd) * scale, pz = z => oy + (s.Hd / 2 - z) * scale;
  const Tmin = s.Ta, Tmax = Math.max(s.max, s.Ta + 1), dr = s.Rd / s.Nr, dz = s.Hd / s.Nz;
  const img = ctx.createImageData(Math.ceil(2 * s.Rd * scale), Math.ceil(s.Hd * scale));
  for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) {
    const r = Math.abs(x / scale - s.Rd), z = s.Hd / 2 - y / scale;
    const i = Math.min(s.Nr - 1, Math.floor(r / dr)), j = Math.min(s.Nz - 1, Math.max(0, Math.floor((z + s.Hd / 2) / dz)));
    const c = ramp((s.T[j * s.Nr + i] - Tmin) / (Tmax - Tmin)), o = 4 * (y * img.width + x);
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, Math.round(ox), Math.round(oy));
  ctx.strokeStyle = "rgba(28,28,26,.55)"; ctx.lineWidth = 1;
  ctx.strokeRect(px(-s.R), pz(s.H / 2), 2 * s.R * scale, s.H * scale);
  ctx.setLineDash([3, 3]); ctx.strokeRect(px(-s.Ro), pz(s.H / 2), 2 * s.Ro * scale, s.H * scale); ctx.setLineDash([]);
  ctx.fillStyle = "#1c1c1a"; ctx.beginPath(); ctx.arc(px(0), pz(0), 3, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = "#6b6a66"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("−15", px(-s.Rd), H - 10); ctx.fillText("0", px(0), H - 10); ctx.fillText("r, mm  15", px(s.Rd), H - 10);
  ctx.textAlign = "left"; ctx.fillText("베드", px(s.R) + 4, pz(s.H / 2) + 12); ctx.fillText("FBG", px(0) + 6, pz(0) + 4);
  const bx = W - mr + 18, bh = ph * .7, by = mt + (ph - bh) / 2;
  for (let y = 0; y < bh; y++) { const c = ramp(1 - y / bh); ctx.fillStyle = `rgb(${c.join(",")})`; ctx.fillRect(bx, by + y, 10, 1.5); }
  ctx.fillStyle = "#6b6a66"; ctx.textAlign = "left"; ctx.fillText(fmt(Tmax) + " °C", bx + 14, by + 4); ctx.fillText(fmt(Tmin) + " °C", bx + 14, by + bh);
}

/* ---------- P–T chart ---------- */
let chartGeom = null;
function drawChart() {
  const { ctx, W, H } = fit($("chart"));
  ctx.clearRect(0, 0, W, H);
  const ml = 44, mr = 16, mt = 12, mb = 28, pw = W - ml - mr, ph = H - mt - mb;
  const allT = [...state.measured.flatMap(m => [m.wall, m.center]), ...(state.curve || state.curveCoarse || []).flatMap(c => [c.wall, c.fbg]), state.sol ? state.sol.fbg : 0];
  const Tmax = Math.ceil(Math.max(100, ...allT) / 100) * 100;
  const px = P => ml + P / state.Pspan * pw, py = T => mt + (1 - (T - 20) / (Tmax - 20)) * ph;
  chartGeom = { ml, pw };
  ctx.strokeStyle = "#e4e2dd"; ctx.lineWidth = 1; ctx.fillStyle = "#6b6a66"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
  for (let T = 200; T <= Tmax; T += 200) { ctx.beginPath(); ctx.moveTo(ml, py(T)); ctx.lineTo(W - mr, py(T)); ctx.stroke(); ctx.fillText(T, ml - 6, py(T) + 4); }
  ctx.textAlign = "center";
  const step = state.Pspan > 40 ? 10 : 5;
  for (let P = 0; P <= state.Pspan; P += step) ctx.fillText(P, px(P), H - 8);
  ctx.textAlign = "left"; ctx.fillText("W", px(state.Pspan) + 4, H - 8);
  // measured range band
  ctx.fillStyle = "rgba(28,28,26,.035)"; ctx.fillRect(px(state.Pmax), mt, px(state.Pspan) - px(state.Pmax), ph);
  ctx.fillStyle = "#a7a5a0"; ctx.textAlign = "left"; ctx.fillText("측정 범위 밖", px(state.Pmax) + 6, mt + 12);
  // model curves
  const curve = state.curve || state.curveCoarse;
  if (curve) for (const [key, color] of [["wall", WALL], ["fbg", CENTER]]) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash(state.curve ? [] : [4, 4]); ctx.beginPath();
    curve.forEach((c, i) => i ? ctx.lineTo(px(c.P), py(c[key])) : ctx.moveTo(px(c.P), py(c[key]))); ctx.stroke(); ctx.setLineDash([]);
  }
  // measured points
  for (const m of state.measured) for (const [key, color] of [["wall", WALL], ["center", CENTER]]) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px(m.P), py(m[key]), 4, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // handle
  const x = px(state.P);
  ctx.strokeStyle = "#1c1c1a"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, mt); ctx.lineTo(x, mt + ph); ctx.stroke();
  if (state.sol) for (const [v, color] of [[state.sol.wall, WALL], [state.sol.fbg, CENTER]]) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, py(v), 7, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.fillStyle = "#1c1c1a"; ctx.beginPath(); ctx.moveTo(x, mt + ph); ctx.lineTo(x - 5, mt + ph + 7); ctx.lineTo(x + 5, mt + ph + 7); ctx.fill();
  // labels
  ctx.font = "12px sans-serif"; ctx.textAlign = "left";
  const last = curve ? curve[curve.length - 1] : null;
  if (last) { ctx.fillStyle = CENTER; ctx.fillText("중심", px(last.P) - 30, py(last.fbg) - 8); ctx.fillStyle = WALL; ctx.fillText("벽", px(last.P) - 22, py(last.wall) + 16); }
}

const chart = $("chart");
let dragging = false;
const powerFromEvent = e => { const r = chart.getBoundingClientRect(); return (e.clientX - r.left - chartGeom.ml) / chartGeom.pw * state.Pspan; };
chart.addEventListener("pointerdown", e => { dragging = true; chart.setPointerCapture(e.pointerId); setPower(powerFromEvent(e)); });
chart.addEventListener("pointermove", e => { if (dragging) setPower(powerFromEvent(e)); });
chart.addEventListener("pointerup", () => { dragging = false; });
chart.addEventListener("pointercancel", () => { dragging = false; });
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") setPower(state.P + .5); else if (e.key === "ArrowLeft") setPower(state.P - .5);
});
$("material").addEventListener("change", e => loadMaterial(e.target.value));
new ResizeObserver(() => { drawMap(); drawChart(); }).observe(document.querySelector("main"));
loadMaterial(state.material);
</script>
</body>
</html>
