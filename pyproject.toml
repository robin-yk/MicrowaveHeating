[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microwave3d"
version = "0.1.0"
description = "Three-dimensional vector microwave, porous-flow, and thermal research solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
microwave3d = "microwave3d.cli:main"

[tool.setuptools.packages.find]
include = ["microwave3d*"]

[tool.setuptools.package-data]
microwave3d = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests3d"]
